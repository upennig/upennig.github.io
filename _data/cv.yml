    funded_phd_projects:
      - name: "George Tridimas — Heilbronn Institute PhD Studentship"
        summary: >
          "Symmetries of C*-algebras through the lens of stable homotopy theory."
          Studies homotopy types of classifying spaces associated to topological
          2-groups arising from G-kernels and cocycle actions on strongly
          self-absorbing C*-algebras.
      - name: "Valerio Bianchi — EPSRC PhD Studentship"
        summary: >
          "K-theory of C*-algebras with applications in TQFT." Gave an equivariant
          classification of UHF-algebra bundles with applications to the
          Freed-Hopkins-Teleman theorem.
      - name: "Álvaro Torras Casas — EPSRC PhD Studentship"
        summary: >
          "Persistent sheaf (co)homology." Studied applications of spectral
          sequences in topological data analysis; developed the PerMaViss
          software package for distributed persistent homology computation.

