    teaching_activities:
      - bullet: >
          Designed and taught the Year 3 module MA3008 – Algebraic Topology every
          spring semester since 2017 (approx. 30–40 students; overall satisfaction
          85–100% across years with data available).
      - bullet: >
          Designed the material for the Year 2 module MA2008 – Linear Algebra II
          in 2018 and taught it in 2018/19 and 2019/20.
      - bullet: >
          Taught the Year 1 module MA1005/MA1055 – Foundations of Mathematics I
          to the full Year 1 cohort since 2020/21 (overall satisfaction 86–95%
          across years; on research leave in 2024/25).

